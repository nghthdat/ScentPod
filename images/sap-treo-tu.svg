<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="60%" stop-color="#141116"/>
      <stop offset="100%" stop-color="#0a080c"/>
    </radialGradient>
    <radialGradient id="softGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#d4b5df" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c9a26b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5eef7"/>
      <stop offset="50%" stop-color="#ece2ef"/>
      <stop offset="100%" stop-color="#ded0e2"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGlow)"/>
  <circle cx="200" cy="220" r="160" fill="url(#softGlow)"/>

  <!-- Hanging Twine Rope -->
  <path d="M200 40 Q205 90 200 130" stroke="#a38259" stroke-width="3" fill="none"/>
  <circle cx="200" cy="135" r="10" fill="none" stroke="#a38259" stroke-width="2"/>
  <circle cx="200" cy="148" r="8" fill="#c9a26b"/>
  <circle cx="200" cy="148" r="4" fill="#141116"/>

  <!-- Shadow behind wax tablet -->
  <rect x="125" y="145" width="160" height="235" rx="20" fill="#040305" opacity="0.6"/>

  <!-- Wax Sachet Tablet -->
  <rect x="120" y="135" width="160" height="235" rx="20" fill="url(#tabletGrad)" stroke="#c9a26b" stroke-width="1.5"/>

  <!-- Hanging hole metal eyelet -->
  <circle cx="200" cy="165" r="9" fill="#141116" stroke="#c9a26b" stroke-width="2"/>

  <!-- Dried Botanical Accents embedded in wax -->
  <!-- Lavender stems -->
  <g transform="translate(145, 205)" stroke="#74597d" stroke-width="1.8" stroke-linecap="round" fill="#8e6a9a">
    <line x1="10" y1="90" x2="25" y2="10"/>
    <ellipse cx="25" cy="10" rx="3" ry="5"/>
    <ellipse cx="22" cy="22" rx="3.5" ry="4"/>
    <ellipse cx="27" cy="23" rx="3.5" ry="4"/>
    <ellipse cx="20" cy="36" rx="3.5" ry="4"/>
    <ellipse cx="25" cy="37" rx="3.5" ry="4"/>
  </g>
  <!-- Dried orange slice / flower accent -->
  <g transform="translate(205, 240)">
    <circle cx="25" cy="25" r="18" fill="#cf8e3e" opacity="0.85"/>
    <circle cx="25" cy="25" r="15" fill="none" stroke="#f6d396" stroke-width="1"/>
    <line x1="25" y1="10" x2="25" y2="40" stroke="#f6d396" stroke-width="0.8"/>
    <line x1="10" y1="25" x2="40" y2="25" stroke="#f6d396" stroke-width="0.8"/>
  </g>

  <!-- Wax Seal / Stamp on tablet -->
  <g transform="translate(160, 310)">
    <circle cx="40" cy="25" r="18" fill="#1b151e" stroke="#c9a26b" stroke-width="1.2"/>
    <text x="40" y="29" font-family="'Cormorant Garamond', serif" font-size="13" fill="#c9a26b" text-anchor="middle" font-weight="700">SP</text>
  </g>

  <!-- Watermark / Title below -->
  <text x="200" y="445" font-family="'Cormorant Garamond', serif" font-size="20" fill="#c9a26b" text-anchor="middle" letter-spacing="2">SCENTPOD</text>
  <text x="200" y="470" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#a89d8f" text-anchor="middle" letter-spacing="1">SÁP TREO TỦ QUẦN ÁO THẢO MỘC</text>
</svg>
