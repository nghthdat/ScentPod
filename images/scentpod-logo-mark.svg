<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c" />
      <stop offset="50%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#c4821a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#e5a93b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fine Outer Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="1.8" />

  <!-- Stylized Flame -->
  <!-- Outer curving flame -->
  <path d="M 50 39.5
           C 49 37, 43 31, 46 22
           C 48 16, 52 14, 50 11
           C 48 16, 44 20, 43 25
           C 42 29, 44 34, 50 39.5 Z" 
        fill="url(#goldGrad)" />
  <path d="M 50 39.5
           C 51 35, 55 31, 55 24
           C 55 19, 53 15, 50 11
           C 55 17, 58 22, 57 28
           C 56 34, 53 37, 50 39.5 Z" 
        fill="url(#goldGrad)" opacity="0.9" />

  <!-- Inner flame teardrop -->
  <path d="M 50 36
           C 48 33, 47 29, 50 25
           C 53 29, 52 33, 50 36 Z" 
        stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />

  <!-- Wick -->
  <line x1="50" y1="39.5" x2="50" y2="43.5" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Candle Top Rim Ellipse -->
  <ellipse cx="50" cy="46" rx="16" ry="4.5" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Candle Body with S-Curve -->
  <!-- Right wall -->
  <line x1="66" y1="46" x2="66" y2="67" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Left wall and S-ribbon flowing to base -->
  <path d="M 34 46
           L 34 52
           C 34 56, 42 59, 53 62
           C 61 64.5, 63 68, 60 70.5
           C 57 73, 45 73, 37 71
           C 34 70, 33 67, 33 62
           L 33 55"
        stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>