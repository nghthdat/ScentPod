<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3c2a1c"/>
      <stop offset="60%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <radialGradient id="warmSpot" cx="45%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffdc91" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#c9a26b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c221a"/>
      <stop offset="100%" stop-color="#19130e"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d5a3"/>
      <stop offset="50%" stop-color="#c9a26b"/>
      <stop offset="100%" stop-color="#916c35"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGlow)"/>
  <circle cx="180" cy="190" r="160" fill="url(#warmSpot)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="400" rx="140" ry="26" fill="#040302" opacity="0.85"/>

  <!-- Gift Box Base (Open presentation tray) -->
  <polygon points="50,280 150,370 350,350 250,260" fill="url(#boxGrad)" stroke="#453325" stroke-width="1.5"/>

  <!-- Mini Candle inside box -->
  <g transform="translate(130, 160)">
    <!-- Candle glow & flame -->
    <path d="M45 42 C49 55, 53 64, 49 71 C46 75, 43 75, 41 71 C37 64, 41 55, 45 42 Z" fill="#ffe299"/>
    <line x1="45" y1="71" x2="45" y2="82" stroke="#22160d" stroke-width="2"/>
    <!-- Jar -->
    <rect x="15" y="80" width="60" height="70" rx="8" fill="#523924" stroke="#c9a26b" stroke-width="1.2" opacity="0.95"/>
    <ellipse cx="45" cy="80" rx="30" ry="10" fill="#fcf8f0"/>
    <text x="45" y="120" font-family="'Cormorant Garamond', serif" font-size="8" fill="#c9a26b" text-anchor="middle">SCENTPOD</text>
  </g>

  <!-- 3 Wax Tins stacked/arranged beside candle -->
  <g transform="translate(210, 220)">
    <ellipse cx="40" cy="85" rx="38" ry="14" fill="#231b15" stroke="#755a3c" stroke-width="1.2"/>
    <ellipse cx="40" cy="82" rx="35" ry="11" fill="#dfcfbe"/>
    <text x="40" y="85" font-family="'Be Vietnam Pro', sans-serif" font-size="6.5" fill="#4d3b2c" text-anchor="middle" font-weight="600">HỌC BÀI</text>

    <ellipse cx="42" cy="55" rx="38" ry="14" fill="#231b15" stroke="#755a3c" stroke-width="1.2"/>
    <ellipse cx="42" cy="52" rx="35" ry="11" fill="#f1e5d6"/>
    <text x="42" y="55" font-family="'Be Vietnam Pro', sans-serif" font-size="6.5" fill="#4d3b2c" text-anchor="middle" font-weight="600">HẸN HÒ</text>

    <ellipse cx="44" cy="25" rx="38" ry="14" fill="#231b15" stroke="#c9a26b" stroke-width="1.5"/>
    <ellipse cx="44" cy="22" rx="35" ry="11" fill="#fdf7f0"/>
    <text x="44" y="25" font-family="'Be Vietnam Pro', sans-serif" font-size="6.5" fill="#c9a26b" text-anchor="middle" font-weight="700">ĐI HỌC</text>
  </g>

  <!-- Ribbon and Bow Accent -->
  <path d="M50 280 L200 395" stroke="url(#ribbonGrad)" stroke-width="6" opacity="0.8"/>
  <circle cx="120" cy="335" r="8" fill="#c9a26b"/>

  <!-- Watermark -->
  <text x="200" y="445" font-family="'Cormorant Garamond', serif" font-size="20" fill="#c9a26b" text-anchor="middle" letter-spacing="2">SCENTPOD</text>
  <text x="200" y="470" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#a89d8f" text-anchor="middle" letter-spacing="1">COMBO NẾN + SÁP TIẾT KIỆM</text>
</svg>
