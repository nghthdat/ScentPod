<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c" />
      <stop offset="50%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#c4821a" />
    </linearGradient>
    <linearGradient id="flameFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae19c" />
      <stop offset="60%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#b87214" />
    </linearGradient>
    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e5a93b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Ring -->
  <circle cx="250" cy="250" r="230" stroke="url(#goldGradient)" stroke-width="2.6" opacity="0.85" />

  <!-- Emblem Group with Subtle Glow -->
  <g filter="url(#subtleGlow)">
    <!-- Flame Motif -->
    <!-- Outer curving flame contour -->
    <path d="M 250 216
             C 246 205, 222 188, 224 152
             C 226 128, 240 115, 246 102
             C 248 98, 252 98, 251 104
             C 247 122, 234 136, 233 154
             C 232 174, 246 195, 250 216 Z" 
          fill="url(#goldGradient)" />
          
    <path d="M 250 216
             C 255 198, 274 182, 272 152
             C 270 128, 258 112, 251 104
             C 256 116, 282 140, 279 168
             C 276 195, 258 208, 250 216 Z" 
          fill="url(#goldGradient)" opacity="0.95" />

    <!-- Inner flame loop -->
    <path d="M 250 202
             C 243 190, 240 172, 250 156
             C 260 172, 257 190, 250 202 Z" 
          stroke="url(#goldGradient)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Candle Wick -->
    <line x1="250" y1="216" x2="250" y2="228" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round" />

    <!-- Candle Top Rim (Oval) -->
    <ellipse cx="250" cy="235" rx="64" ry="18" stroke="url(#goldGradient)" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Candle Body Cylinder with S-Shape Ribbon -->
    <!-- Right side vertical contour -->
    <line x1="314" y1="235" x2="314" y2="315" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />

    <!-- Left side contour and S-ribbon connecting to base -->
    <path d="M 186 235
             L 186 260
             C 186 276, 218 288, 260 300
             C 292 308, 302 322, 290 332
             C 276 342, 228 342, 198 335
             C 186 331, 184 318, 184 300
             L 184 275"
          stroke="url(#goldGradient)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: SCENTPOD -->
  <text x="250" y="386" 
        text-anchor="middle" 
        fill="url(#goldGradient)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="34px" 
        font-weight="800" 
        letter-spacing="0.16em">SCENTPOD</text>

  <!-- Typography: AROMA & COMFORT -->
  <text x="250" y="416" 
        text-anchor="middle" 
        fill="url(#goldGradient)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="14.5px" 
        font-weight="500" 
        letter-spacing="0.22em" 
        opacity="0.9">AROMA &amp; COMFORT</text>
</svg>